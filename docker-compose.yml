services:
  ai-service:
    build: .
    container_name: ai-devops-assistant
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - API_KEY=${API_KEY:-}
      - LITELLM_LOCAL_MODEL_COST_MAP=True
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped